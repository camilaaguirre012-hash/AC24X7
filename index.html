<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C24X7</title><style>body{margin:0;font-family:Arial;background:#0f1e2e}header{background:#0f1e2e;color:#fff;padding:14px;display:flex;justify-content:space-between}.card{background:#fff;border-radius:16px;padding:16px;margin:14px}input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:10px}button{width:100%;padding:13px;border:0;border-radius:12px;background:#ff9d00;font-weight:800;margin-top:8px}.ghost{background:#eee}.tile{background:#fff;border:2px solid #eee;border-radius:14px;padding:14px;margin:8px 0}.hidden{display:none}.res{background:#ecfdf5;padding:10px;border-radius:10px;margin-top:8px}</style></head><body><header><b>C24X7</b><span>Comex 24/7 Chile</span></header><div id="auth" class="card"><h2>¡Bienvenida a C24X7!</h2><p>Crea tu cuenta gratis</p><input id="n" placeholder="Tu nombre"><input id="u" placeholder="Crea tu usuario"><input id="p" type="password" placeholder="Crea tu contraseña"><button onclick="crear()">Crear mi cuenta</button><hr><input id="lu" placeholder="Tu usuario"><input id="lp" type="password" placeholder="Tu contraseña"><button onclick="entrar()">Entrar</button><p id="msg"></p></div><div id="menu" class="card hidden"><h2 id="saludo">Hola!</h2><div class="tile" onclick="ver('asesoria')"><b>1. Asesoria Comex</b><p>Normativa, clasificacion, tratados</p></div><div class="tile" onclick="ver('cotiza')"><b>2. Cotizacion Servicios</b><p>Agencia, flete, seguro, almacenaje</p></div><div class="tile" onclick="ver('mis')"><b>3. Mis Consultas</b><p>Tu historial</p></div><button class="ghost" onclick="location.reload()">Cerrar sesion</button></div><div id="asesoria" class="card hidden"><button class="ghost" onclick="volver()">Volver</button><h2>Asesoria Comex</h2><input id="partida" placeholder="Partida Ej: 8517.1200"><input id="merc" placeholder="Mercancia"><button onclick="clas()">Clasificar</button><div id="r1"></div><p>Valoracion:</p><input id="vm" type="number" placeholder="Valor FOB USD"><input id="fl" type="number" placeholder="Flete USD"><input id="sg" type="number" placeholder="Seguro USD"><button onclick="val()">Calcular CIF</button><div id="r2"></div></div><div id="cotiza" class="card hidden"><button class="ghost" onclick="volver()">Volver</button><h2>Cotizacion</h2><input id="qv" type="number" placeholder="Valor mercancia USD"><button onclick="cot()">Calcular Agencia + Seguro</button><div id="r3"></div></div><div id="mis" class="card hidden"><button class="ghost" onclick="volver()">Volver</button><h2>Mis Consultas</h2><div id="lista"></div></div><script>let H=JSON.parse(localStorage.getItem('h')||'[]');let U=JSON.parse(localStorage.getItem('u')||'{}');function crear(){let u=document.getElementById('u').value;let p=document.getElementById('p').value;let n=document.getElementById('n').value;if(!u||!p){alert('Pon usuario y clave');return}U[u]={n,p};localStorage.setItem('u',JSON.stringify(U));alert('Cuenta creada! Ahora entra abajo');}function entrar(){let u=document.getElementById('lu').value;let p=document.getElementById('lp').value;if(U[u]&&U[u].p==p){document.getElementById('auth').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');document.getElementById('saludo').textContent='Hola, '+(U[u].n||u)}else{document.getElementById('msg').textContent='Usuario o clave incorrecta'}}function ver(id){document.getElementById('menu').classList.add('hidden');document.getElementById(id).classList.remove('hidden');if(id=='mis'){document.getElementById('lista').innerHTML=H.length?H.map(x=>'<p>'+x+'</p>').join(''):'Aun no tienes consultas'}}function volver(){['asesoria','cotiza','mis'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById('menu').classList.remove('hidden')}function clas(){let p=document.getElementById('partida').value;document.getElementById('r1').innerHTML='<div class=res>Partida '+p+' valida. Con certificado de origen 0%, sin certificado 6%.</div>';H.push('Clasificacion '+p);localStorage.setItem('h',JSON.stringify(H))}function val(){let v=+document.getElementById('vm').value||0;let f=+document.getElementById('fl').value||0;let s=+document.getElementById('sg').value||0;let cif=v+f+s;let adv=cif*0.06;let iva=(cif+adv)*0.19;document.getElementById('r2').innerHTML='<div class=res>CIF $'+cif+'<br>Derecho $'+adv.toFixed(2)+'<br>IVA $'+iva.toFixed(2)+'<br><b>Total $'+(cif+adv+iva).toFixed(2)+' USD</b></div>';H.push('Valoracion CIF '+cif);localStorage.setItem('h',JSON.stringify(H))}function cot(){let v=+document.getElementById('qv').value||0;let hon=Math.max(120,v*0.004);let seg=v*1.1*0.0035;document.getElementById('r3').innerHTML='<div class=res>Agencia $'+hon.toFixed(2)+'<br>Seguro $'+seg.toFixed(2)+'<br><b>Total aprox $'+(hon+seg+45).toFixed(2)+' USD</b></div>';H.push('Cotizacion '+v);localStorage.setItem('h',JSON.stringify(H))}</script></body></html>
