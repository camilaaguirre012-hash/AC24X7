<!-- CLASIFICACIÓN ARANCELARIA - BUSCADOR 4-6-8 -->
<section id="clasificacion" style="padding:40px 20px;max-width:900px;margin:auto">
  <h2>🔍 Clasificación Arancelaria</h2>
  <p>Busca tu producto paso a paso: elige la Partida de 4 dígitos, luego la Subpartida de 6, hasta llegar al Código completo de 8.</p>

  <input id="buscadorArancel" type="text" placeholder="Ej: café, 0901, notebook, vino..." 
    style="width:100%;padding:14px;border-radius:10px;border:1px solid #ccc;font-size:16px">

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px">
    <select id="sel4" style="flex:1;padding:12px;border-radius:10px"><option value="">1️⃣ Paso 1 - Partida 4 dígitos</option></select>
    <select id="sel6" style="flex:1;padding:12px;border-radius:10px"><option value="">2️⃣ Paso 2 - Subpartida 6 dígitos</option></select>
    <select id="sel8" style="flex:1;padding:12px;border-radius:10px"><option value="">3️⃣ Paso 3 - Código 8 dígitos</option></select>
  </div>

  <div id="resultadoArancel" style="margin-top:20px;padding:20px;background:#f0fdf4;border-radius:12px;display:none"></div>
  <p id="cargandoArancel" style="margin-top:10px">Cargando Arancel 2023...</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let DATOS=[];
async function cargarArancel(){
  const res = await fetch('ARANCEL_2023.xlsx');
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf,{type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(ws,{header:1});
  // Col 0=Partida 4 dig, Col 1=Codigo, Col 2=Descripcion, Col 3=Unidad, Col 4=Adv
  filas.forEach(f=>{
    let partida=(f[0]||'').toString().trim();
    let codigo=(f[1]||'').toString().trim();
    let glosa=(f[2]||'').toString().trim();
    if(/^\d{2}\.\d{2}$/.test(partida) && glosa){
      DATOS.push({tipo:'4', codigo:partida.replace('.',''), muestra:partida, desc:glosa});
    }
    if(/^\d{4}\.\d{4}$/.test(codigo) && glosa){
      DATOS.push({tipo:'8', codigo:codigo.replace('.',''), muestra:codigo, desc:glosa, unidad:f[3]||'', adv:f[4]||''});
    }
    if(/^\d{4}\.\d{2}$/.test(codigo) && glosa){
      DATOS.push({tipo:'6', codigo:codigo.replace('.',''), muestra:codigo, desc:glosa});
    }
  });
  llenar4();
  document.getElementById('cargandoArancel').style.display='none';
}
function llenar4(){
  let sel=document.getElementById('sel4');
  DATOS.filter(d=>d.tipo=='4').forEach(d=>{
    let o=document.createElement('option'); o.value=d.codigo; o.textContent=d.muestra+' - '+d.desc;
    sel.appendChild(o);
  });
}
document.getElementById('sel4').addEventListener('change',e=>{
  let base=e.target.value;
  let sel6=document.getElementById('sel6'); sel6.innerHTML='<option value="">2️⃣ Paso 2 - Subpartida 6 dígitos</option>';
  let sel8=document.getElementById('sel8'); sel8.innerHTML='<option value="">3️⃣ Paso 3 - Código 8 dígitos</option>';
  DATOS.filter(d=>d.tipo=='6' && d.codigo.startsWith(base)).forEach(d=>{
    let o=document.createElement('option'); o.value=d.codigo; o.textContent=d.muestra+' - '+d.desc; sel6.appendChild(o);
  });
  // Si no hay nivel 6, mostrar directo los de 8
  if(sel6.options.length<=1){
    DATOS.filter(d=>d.tipo=='8' && d.codigo.startsWith(base)).forEach(d=>{
      let o=document.createElement('option'); o.value=d.codigo; o.textContent=d.muestra+' - '+d.desc; sel8.appendChild(o);
    });
  }
});
document.getElementById('sel6').addEventListener('change',e=>{
  let base=e.target.value;
  let sel8=document.getElementById('sel8'); sel8.innerHTML='<option value="">3️⃣ Paso 3 - Código 8 dígitos</option>';
  DATOS.filter(d=>d.tipo=='8' && d.codigo.startsWith(base)).forEach(d=>{
    let o=document.createElement('option'); o.value=d.codigo; o.textContent=d.muestra+' - '+d.desc; sel8.appendChild(o);
  });
});
document.getElementById('sel8').addEventListener('change',e=>{
  let d=DATOS.find(x=>x.tipo=='8' && x.codigo==e.target.value);
  if(!d) return;
  let div=document.getElementById('resultadoArancel');
  div.style.display='block';
  div.innerHTML='<b>✅ Código completo: '+d.muestra+'</b><br>'+d.desc+'<br><b>Unidad:</b> '+(d.unidad||'-')+' | <b>Ad-Valorem:</b> '+(d.adv||'6')+'%<br><br><a href="https://wa.me/569XXXXXXXX?text=Hola C24X7, quiero clasificar mi producto '+d.muestra+' - '+d.desc+'" style="background:#25D366;color:white;padding:12px 18px;border-radius:10px;text-decoration:none;display:inline-block">Consultar este código por WhatsApp</a>';
});
document.getElementById('buscadorArancel').addEventListener('input',e=>{
  let q=e.target.value.toLowerCase();
  if(q.length<3) return;
  let found=DATOS.filter(d=>d.desc.toLowerCase().includes(q) || d.codigo.includes(q.replace('.',''))).slice(0,20);
  let div=document.getElementById('resultadoArancel');
  if(found.length){
    div.style.display='block';
    div.innerHTML='<b>Resultados para "'+e.target.value+'":</b><br>'+found.map(f=>f.muestra+' - '+f.desc).join('<br>');
  }
});
cargarArancel();
</script>
